<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panorama-test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        #panorama { width: 100%; height: 100vh; }
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
    </style>
</head>
<body>

<div id="panorama"></div>

<script>
pannellum.viewer('panorama', {   
    "default": {
        "firstScene": "A", 
        "author": "Il Tuo Nome",
        "sceneFadeDuration": 1000, 
        "hotSpotDebug": false,
        "autoLoad": true
    },

    "scenes": {
        // --- PRIMA: A ---
        "A": {
            "title": "A",
            "type": "equirectangular", // Aggiunto per sicurezza (è buona prassi specificarlo)
            "panorama": "A.jpg", 
            "autoRotate": -2,
            "hotSpots": [
                {
                    "pitch": -25,    
                    "yaw": -0,      
                    "type": "scene",
                    "text": "B",
                    "sceneId": "B" 
                }
            ]
        },

        // --- SECONDA: B ---
        "B": {
            "title": "B",
            "type": "equirectangular",
            "panorama": "B.jpg",
            "autoRotate": -2,
            "hotSpots": [
                {
                    "pitch": -21,
                    "yaw": -35,
                    "type": "scene",
                    "text": "A",
                    "sceneId": "A"
                }, // <--- VIRGOLA MANCANTE AGGIUNTA QUI
                {
                    "pitch": -25,
                    "yaw": 90,
                    "type": "scene",
                    "text": "C",
                    "sceneId": "C"
                }
            ]
        }, // <--- VIRGOLA MANCANTE AGGIUNTA QUI
            
        // --- TERZA: C ---
        "C": {
            "title": "C",
            "type": "equirectangular",
            "panorama": "C.jpg",
            "autoRotate": -2,
            "hotSpots": [
                {
                    "pitch": -25,
                    "yaw": -115,
                    "type": "scene",
                    "text": "B",
                    "sceneId": "B"
                }
            ]
        }
    }
});
</script>

</body>
</html>
